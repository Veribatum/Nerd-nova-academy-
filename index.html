<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1015">
  <meta name="description" content="Report for duty with Nova. Investigate shipboard technical faults, repair real systems, and earn your place on watch.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:8765 https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Nerd Nova Academy | Your Watch. Your Ship.</title>
  <link rel="icon" href="assets/academy-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/academy.css">
  <link rel="preload" as="image" href="assets/nova-command.webp">
</head>
<body>
  <a class="skip-link" href="#main">Skip to mission content</a>
  <header class="site-header">
    <a class="brand" href="#/watch" aria-label="Nerd Nova Academy watchdesk"><img src="assets/academy-mark.svg" width="42" height="46" alt=""><span>NERD NOVA<small>TECHNICAL OPERATIONS ACADEMY</small></span></a>
    <nav class="main-nav" aria-label="Academy navigation" id="navigation"></nav>
    <button class="save-beacon" data-action="sync-dialog" id="save-beacon" aria-label="Cloud save connection"></button>
  </header>
  <div class="ship-status"><span><span class="live-dot"></span> NNS WAYFARER</span><span>TRAINING DETACHMENT <i>/</i> FICTIONAL OPERATIONS</span><span id="watch-clock"></span></div>
  <div id="storage-warning" class="storage-warning" role="alert" hidden></div>
  <main id="main" tabindex="-1"><div class="boot-state">Establishing contact with Nova…</div></main>
  <footer class="site-footer"><a href="#/watch">NERD NOVA ACADEMY</a><span>TRAIN SMART. BREAK LABS. FIX SYSTEMS.</span><small>Fictional, unclassified training. v1.0</small></footer>
  <dialog id="dialog"><div class="dialog-shell"><button class="dialog-close" data-action="close-dialog" aria-label="Close dialog">×</button><div id="dialog-content"></div><p id="dialog-error" role="alert" hidden></p></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>This Academy needs JavaScript to run its local simulations and preserve your progress.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
