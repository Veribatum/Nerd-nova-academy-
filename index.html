<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e1a"><meta name="description" content="Nerd Nova Academy — learn networking by solving missions."><title>Nerd Nova // Academy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
:root{--bg:#080e1a;--panel:#101b2c;--panel2:#142338;--stroke:#273b54;--text:#edf5ff;--muted:#91a8c0;--cyan:#45dfdb;--orange:#f8b65d;--red:#fd6877;--green:#63e2ab;--shadow:0 24px 55px #0005}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#143b53 0,transparent 34%),var(--bg);color:var(--text);font:15px/1.5 'DM Sans',system-ui,sans-serif;min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}.mono,.eyebrow,.tag,.btn,.statnum,.nav-item small{font-family:'JetBrains Mono',monospace}.shell{display:grid;grid-template-columns:245px 1fr;max-width:1600px;min-height:100vh;margin:auto}.sidebar{border-right:1px solid var(--stroke);padding:28px 18px;background:#0a1422;display:flex;flex-direction:column;gap:27px}.brand{display:flex;align-items:center;gap:12px;padding:5px 8px}.mark{display:grid;place-items:center;width:44px;height:44px;border:2px solid var(--cyan);clip-path:polygon(50% 0,100% 26%,100% 74%,50% 100%,0 74%,0 26%);background:#123744;color:var(--cyan);font:800 27px 'Barlow Condensed'}.brand b{display:block;font:800 25px/1 'Barlow Condensed';letter-spacing:1px}.brand small{color:var(--cyan);font:10px 'JetBrains Mono';letter-spacing:2px}.nav{display:grid;gap:5px}.nav-item{width:100%;text-align:left;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:10px;padding:12px 13px;display:flex;align-items:center;gap:12px;font-weight:700}.nav-item i{font-style:normal;font-size:20px;width:23px;text-align:center}.nav-item.active{background:#173248;border-color:#25697a;color:var(--cyan)}.nav-item:hover{background:#1b3044;color:white}.side-foot{margin-top:auto;border-top:1px solid var(--stroke);padding:20px 10px;color:var(--muted);font-size:12px}.side-foot strong{color:var(--green)}main{min-width:0;padding:28px clamp(18px,4vw,64px) 60px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:31px}.eyebrow{color:var(--cyan);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green)}.level{font:700 12px 'JetBrains Mono';color:var(--orange);background:#312817;border:1px solid #71562c;border-radius:99px;padding:7px 12px}.hero{position:relative;overflow:hidden;border:1px solid #2f6776;border-radius:18px;min-height:265px;background:linear-gradient(115deg,#16334b,#0f2338 56%,#153e48);padding:32px 34px;display:flex;align-items:center;box-shadow:var(--shadow)}.hero:before{content:'';position:absolute;width:450px;height:450px;right:-100px;top:-100px;border:1px solid #50d7da55;border-radius:50%;box-shadow:0 0 0 35px #45dfdb0d,0 0 0 76px #45dfdb0a,0 0 0 122px #45dfdb0a}.hero:after{content:'◈';font-size:240px;line-height:1;position:absolute;right:50px;top:13px;color:#39dcd51b;transform:rotate(-20deg)}.hero-body{position:relative;z-index:1;max-width:590px}.hero h1{font:800 clamp(39px,5.2vw,74px)/.98 'Barlow Condensed';letter-spacing:1px;margin:13px 0}.hero h1 em{font-style:normal;color:var(--cyan)}.hero p{color:#c2d9e8;margin:0 0 20px;max-width:500px}.btn{border:1px solid #4ac4c1;background:var(--cyan);color:#06202c;font-size:12px;letter-spacing:1px;font-weight:700;text-transform:uppercase;border-radius:8px;padding:12px 18px}.btn:hover{filter:brightness(1.12)}.btn.secondary{background:#162b3e;color:var(--text);border-color:#3b5a70}.btn:disabled{opacity:.4;cursor:not-allowed}.section-title{font:800 28px 'Barlow Condensed';text-transform:uppercase;letter-spacing:1px;margin:0}.section-sub{color:var(--muted);font-size:13px;margin:3px 0 0}.section-head{display:flex;align-items:end;justify-content:space-between;margin:30px 0 14px;gap:10px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:linear-gradient(150deg,#15263b,#101b2c);border:1px solid var(--stroke);border-radius:14px;padding:21px;min-width:0}.card h3{font:700 25px 'Barlow Condensed';margin:12px 0 5px}.card p{color:var(--muted);font-size:13px;min-height:57px}.card .glyph{font-size:32px;color:var(--cyan)}.card footer{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:8px}.tag{font-size:10px;color:var(--cyan);background:#183847;padding:5px 7px;border-radius:5px}.tag.orange{background:#39301e;color:var(--orange)}.statstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:16px}.stat{padding:16px 20px;border:1px solid var(--stroke);border-radius:12px;background:#111d2e}.statnum{font-size:26px;font-weight:700;color:var(--text)}.stat-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}.panel{border:1px solid var(--stroke);background:var(--panel);border-radius:14px;padding:23px;margin-bottom:16px}.panel h2{font:800 32px 'Barlow Condensed';margin:0 0 10px}.panel p{color:#b8c9d8}.split{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.option{display:block;width:100%;text-align:left;border:1px solid #35516a;background:#12253b;color:var(--text);padding:13px 15px;margin:9px 0;border-radius:9px;transition:.15s}.option:hover{border-color:var(--cyan);background:#1c3a4c}.option.selected{border-color:var(--cyan);background:#173c46;box-shadow:inset 3px 0 var(--cyan)}.option:disabled{cursor:default}.option.correct{border-color:var(--green);background:#153c36}.option.wrong{border-color:var(--red);background:#44242c}.feedback{background:#162d3e;border-left:3px solid var(--cyan);padding:15px;border-radius:6px;margin:16px 0;color:#d9e9f4}.feedback.bad{border-color:var(--orange)}.feedback.good{border-color:var(--green)}.muted{color:var(--muted)}.progress{height:8px;background:#253346;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#29a6b6,var(--cyan));transition:width .3s}.mission-meta{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.mission-meta span{border:1px solid #38556c;border-radius:99px;color:#c0d6e6;padding:5px 11px;font:11px 'JetBrains Mono'}.nodes{display:grid;grid-template-columns:1fr 50px 1fr 50px 1fr;align-items:center;text-align:center;gap:5px;padding:15px 0}.node{background:#172e40;border:1px solid #397085;border-radius:10px;padding:15px 4px;font:11px 'JetBrains Mono';min-height:79px}.node b{display:block;font:800 21px 'Barlow Condensed';margin-bottom:5px}.wire{border-top:2px dashed #5b8b9d}.layers{display:grid;gap:8px}.layer{border:1px solid #334e66;background:#15283c;border-radius:10px;display:grid;grid-template-columns:47px 1fr;gap:13px;align-items:center;padding:10px;text-align:left;color:var(--text)}.layer:hover,.layer.expanded{border-color:var(--cyan)}.layer-num{border-radius:7px;background:#23475b;color:var(--cyan);font:800 29px 'Barlow Condensed';text-align:center;padding:7px}.layer strong{display:block}.layer small{color:var(--muted);display:block}.layer-detail{grid-column:2;color:#d0e6f5;font-size:13px;padding-bottom:8px}.terminal{font:12px/1.9 'JetBrains Mono';padding:18px;background:#060d13;border:1px solid #35516a;border-radius:10px;color:#a9f2d4;white-space:pre-wrap;overflow-wrap:anywhere}.terminal .dim{color:#6a8ca0}.lesson-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.tiny{font-size:12px;color:var(--muted)}.reset{background:transparent;color:var(--muted);border:0;text-decoration:underline;font-size:12px}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:20px;background:#163f42;color:#b5ffee;border:1px solid #369d96;padding:14px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:20}.empty{padding:40px 20px;text-align:center}.footer{margin-top:38px;color:#69869e;font:11px 'JetBrains Mono';text-align:center}
@media(max-width:1000px){.cards{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}}@media(max-width:720px){.shell{display:block}.sidebar{position:sticky;top:0;z-index:10;border:0;border-bottom:1px solid var(--stroke);padding:10px 14px;display:block}.brand{float:left;padding:0}.brand .mark{width:36px;height:36px;font-size:22px}.brand b{font-size:18px}.brand small{font-size:8px}.nav{display:flex;justify-content:flex-end;gap:3px}.nav-item{width:auto;padding:7px;display:block;text-align:center;font-size:0}.nav-item i{font-size:20px;display:block}.side-foot{display:none}main{padding:17px 14px 72px}.topbar{margin-bottom:17px}.hero{min-height:255px;padding:24px}.hero:after{right:-15px;opacity:.5}.cards{grid-template-columns:1fr}.card p{min-height:0}.statstrip{gap:7px}.stat{padding:11px}.statnum{font-size:19px}.stat-label{font-size:9px}.nodes{grid-template-columns:1fr 20px 1fr 20px 1fr}.node{font-size:9px}.node b{font-size:17px}.lesson-grid{grid-template-columns:1fr}.panel{padding:17px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="mark">N</div><div><b>NERD NOVA</b><small>ACADEMY // 01</small></div></div><nav class="nav" aria-label="Primary"><button class="nav-item active" data-page="home"><i>⌂</i> Home</button><button class="nav-item" data-page="missions"><i>◎</i> Missions</button><button class="nav-item" data-page="field"><i>▤</i> Field Guide</button><button class="nav-item" data-page="profile"><i>◈</i> Profile</button></nav><div class="side-foot"><span class="dot" style="display:inline-block;margin-right:5px"></span><strong>OFFLINE TRAINING READY</strong><br>Fictional networks only.<br>No operational data required.</div></aside><main><header class="topbar"><div><div class="eyebrow" id="crumb">TRAINING COMMAND / HOME</div><div class="status"><span class="dot"></span> SYSTEM ONLINE</div></div><span class="level" id="levelBadge">LVL 01 · ROOKIE</span></header><div id="view"></div><footer class="footer">NERD NOVA ACADEMY // TRAIN SMART. BREAK LABS. FIX SYSTEMS.<br>ALL NETWORKS AND MISSIONS ARE FICTIONAL TRAINING DATA.</footer></main></div><div id="toast" role="status" aria-live="polite" class="toast hidden"></div>
<script>
(function(){
'use strict';
const KEY='nerdnova_v1_progress';
const defaults={xp:0,completed:[],attempts:0,streak:0,award:[]};
let store;
try{store=Object.assign({},defaults,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){store={...defaults}}
let page='home',missionIndex=0,questionIndex=0,selection=null,checked=false,expandedLayer=-1;
const levels=['ROOKIE','TECHNICIAN','SPECIALIST','ENGINEER','ARCHITECT','NOVA ELITE'];
const missions=[
{id:'link',code:'OPS-001',name:'The Silent Camera',subtitle:'A new camera is powered on, but video is missing.',tag:'OSI / NETWORKING',duration:'5 MIN',xp:80,icon:'◉',questions:[
{prompt:'A camera powers on and its Ethernet link light is illuminated. What has that established?',options:['All seven OSI layers are healthy','An Ethernet physical link is detected','The camera has the correct IP address','UDP packets are definitely reaching the viewer'],answer:1,why:'A link light points to Layer 1 connectivity. It does not prove that VLANs, IP addressing, or application traffic are working.',log:'CAM-01 power: ON\\nETH link: UP\\nVideo: NO SIGNAL'},
{prompt:'The viewer is 192.168.10.20/24 and the camera is 192.168.20.50/24. What should you verify next?',options:['Whether the approved design provides routing between these subnets','Whether the monitor brightness is set correctly','Whether you should disable the firewall on every device','Whether replacing the camera fixes the subnet mismatch'],answer:0,why:'These are different /24 subnets. A valid route and policy may be required. Verify the intended network design before changing configuration.',log:'VIEWER 192.168.10.20/24\\nCAMERA 192.168.20.50/24\\nGATEWAY: Not yet verified'},
{prompt:'Both IPs are now in 192.168.10.0/24, but one switch port is access VLAN 10 and the other is VLAN 20. What is likely wrong?',options:['DNS is always required for cameras','The devices are in separate Layer 2 broadcast domains','The IP addresses must end with the same number','The cable cannot carry video'],answer:1,why:'VLAN separation prevents ordinary direct Layer 2 delivery, even with addresses that look compatible. Check approved port/VLAN assignments.',log:'SWITCH PORT 4: ACCESS VLAN 10\\nSWITCH PORT 7: ACCESS VLAN 20\\nPhysical links: UP'},
{prompt:'With both devices on the same subnet and VLAN, the viewer knows the camera IP but not its Ethernet MAC. Which protocol is used?',options:['DNS','DHCP','ARP','NTP'],answer:2,why:'ARP broadcasts a request for a local IPv4 address and learns its MAC address from a reply. DNS resolves names to addresses.',log:'VIEWER ARP CACHE:\\n192.168.10.50 -> [INCOMPLETE]'},
{prompt:'You can ping the camera, but video is still absent. What is a sensible next investigation?',options:['Declare Layer 3 entirely broken','Inspect video endpoints, ports, stream settings, and permitted traffic','Move the camera to a random VLAN','Reboot the entire network'],answer:1,why:'ICMP reachability does not prove that the application or UDP video stream is healthy. Follow the approved application traffic path.',log:'ICMP echo: REPLY\\nVideo client: TIMEOUT\\nStream protocol: UDP'}
]},
{id:'switch',code:'OPS-002',name:'VLAN Lockout',subtitle:'Find the configuration mismatch in a lab switch.',tag:'SWITCHING',duration:'4 MIN',xp:60,icon:'⌘',questions:[
{prompt:'Host A is on switch port 2 (VLAN 30) and Host B is on port 8 (VLAN 40). Both hosts use 10.10.30.0/24. What is the first issue?',options:['Different VLANs isolate the hosts at Layer 2','A /24 mask is invalid','Every switch needs a public IP','Their MAC addresses are too long'],answer:0,why:'The ports are in different broadcast domains. Confirm the intended VLAN topology before correcting a port.',log:'PORT 2: access vlan 30\\nPORT 8: access vlan 40\\nSTATUS: connected'},
{prompt:'A single Ethernet cable carries multiple tagged VLANs between two switches. What is the link usually called?',options:['Console port','Access port','Trunk','Loopback'],answer:2,why:'A trunk typically transports multiple VLANs using 802.1Q tagging. Its allowed VLAN list must agree with the network plan.',log:'LINK SW-A <> SW-B\\n802.1Q TAGS DETECTED'},
{prompt:'A device sends a Layer 2 broadcast on VLAN 30. Which ports normally receive it?',options:['All ports in every VLAN','Relevant forwarding ports in VLAN 30','Only the default gateway port','No ports because switches block broadcasts'],answer:1,why:'Switches flood broadcasts within the same VLAN/broadcast domain, subject to port state and security controls.',log:'BROADCAST DST: FF:FF:FF:FF:FF:FF\\nINGRESS VLAN: 30'}
]},
{id:'packet',code:'OPS-003',name:'Packet Hunter',subtitle:'Read the clues and distinguish protocols.',tag:'PACKET ANALYSIS',duration:'4 MIN',xp:60,icon:'⌁',questions:[
{prompt:'A host sends “Who has 192.168.1.50? Tell 192.168.1.10.” What are you observing?',options:['ARP request','DNS response','TCP handshake','DHCP offer'],answer:0,why:'That is the classic structure of an ARP request used to discover a MAC address on a local IPv4 link.',log:'ARP Who has 192.168.1.50? Tell 192.168.1.10'},
{prompt:'You see SYN → SYN,ACK → ACK. Which protocol behavior is this?',options:['UDP video streaming','TCP three-way handshake','ARP cache expiration','ICMP echo'],answer:1,why:'TCP establishes a connection using SYN, SYN-ACK, and ACK before ordinary data transfer.',log:'1 TCP SYN\\n2 TCP SYN, ACK\\n3 TCP ACK'},
{prompt:'A UDP video stream shows gaps in application sequence numbers. What is a reasonable hypothesis?',options:['Every packet was delivered perfectly','Packet loss or out-of-order arrival may have occurred','DNS renamed the camera','The Ethernet cable has no connectors'],answer:1,why:'Sequence gaps can signal loss or reordering, but capture placement and application behavior also matter. Investigate rather than assume.',log:'UDP STREAM: seq 101,102,104,105\\nAPP NOTE: seq 103 absent from sample'}
]}
];
const layerData=[
['Application','What the user-facing software does.','A video player requests a camera stream; check URLs, authentication, and app configuration.'],
['Presentation','How data is encoded and interpreted.','Video codec mismatch or unsupported stream format.'],
['Session','How conversations are established and maintained.','Application control session drops while a stream is active.'],
['Transport','Ports, TCP reliability and UDP datagrams.','Camera sends UDP traffic to the wrong destination port.'],
['Network','IP addressing and routing between networks.','Camera and viewer live on different subnets with no valid route.'],
['Data Link','MAC addresses, Ethernet frames, VLANs and switching.','Camera switch port placed in the wrong access VLAN.'],
['Physical','Cables, signals, ports, radio link, and power.','Loose Ethernet cable or failed network link.']
];
const el=id=>document.getElementById(id);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function level(){return Math.min(5,Math.floor(store.xp/180))}
function levelTag(){return 'LVL '+String(level()+1).padStart(2,'0')+' · '+levels[level()]}
function toast(s){const t=el('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),3000)}
function nav(p){page=p;selection=null;checked=false;questionIndex=0;document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo({top:0,behavior:'instant'})}
function home(){return '<section class="hero"><div class="hero-body"><div class="eyebrow">YOUR NEXT ASSIGNMENT // READY</div><h1>LEARN THE SYSTEM.<br><em>OWN THE PROBLEM.</em></h1><p>Hands-on networking lessons disguised as missions. Diagnose faults, earn XP, and build the skills you actually use.</p><button class="btn" data-action="start" data-idx="0">▶ DEPLOY FIRST MISSION</button></div></section><div class="statstrip"><div class="stat"><div class="statnum">'+store.xp+'</div><div class="stat-label">Total XP</div></div><div class="stat"><div class="statnum">'+store.completed.length+'/'+missions.length+'</div><div class="stat-label">Missions cleared</div></div><div class="stat"><div class="statnum">'+store.attempts+'</div><div class="stat-label">Challenges attempted</div></div></div>'+missionCards('Featured missions')}
function missionCards(title){return '<div class="section-head"><div><h2 class="section-title">'+title+'</h2><p class="section-sub">No trick selections. Read the evidence and choose your move.</p></div></div><div class="cards">'+missions.map((m,i)=>'<article class="card"><div class="glyph">'+m.icon+'</div><div class="eyebrow">'+m.code+'</div><h3>'+m.name+'</h3><p>'+m.subtitle+'</p><span class="tag">'+m.tag+'</span><footer><span class="tiny">'+m.duration+' · +'+m.xp+' XP</span><button class="btn secondary" data-action="start" data-idx="'+i+'">'+(store.completed.includes(m.id)?'REPLAY':'DEPLOY')+' ↗</button></footer></article>').join('')+'</div>'}
function mission(){const m=missions[missionIndex],q=m.questions[questionIndex],n=m.questions.length;return '<div class="eyebrow">'+m.code+' / ACTIVE MISSION</div><div class="section-head" style="margin-top:6px"><div><h1 class="section-title" style="font-size:45px">'+m.name+'</h1><p class="section-sub">'+m.subtitle+'</p></div><button class="btn secondary" data-action="leave">EXIT</button></div><div class="mission-meta"><span>'+m.tag+'</span><span>QUESTION '+(questionIndex+1)+' / '+n+'</span><span>+'+m.xp+' XP ON CLEAR</span></div><div class="progress"><div style="width:'+((questionIndex)/n*100)+'%"></div></div><div class="split" style="margin-top:17px"><section class="panel"><div class="eyebrow">YOUR DIAGNOSIS</div><h2 style="margin-top:9px">'+escape(q.prompt)+'</h2><div id="options">'+q.options.map((o,i)=>'<button class="option'+(selection===i?' selected':'')+(checked&&i===q.answer?' correct':'')+(checked&&selection===i&&i!==q.answer?' wrong':'')+'" data-action="choose" data-value="'+i+'" '+(checked?'disabled':'')+'><span class="mono" style="color:var(--cyan);margin-right:10px">'+String.fromCharCode(65+i)+'.</span>'+escape(o)+'</button>').join('')+'</div>'+(checked?'<div class="feedback '+(selection===q.answer?'good':'bad')+'"><strong>'+(selection===q.answer?'✓ Correct call.':'△ Not quite — debrief:')+'</strong><br>'+escape(q.why)+'</div>':'')+'<button class="btn" data-action="'+(checked?'next':'check')+'" '+(!checked&&selection===null?'disabled':'')+'>'+(checked?(questionIndex===n-1?'COMPLETE MISSION →':'NEXT SCENARIO →'):'LOCK IN ANSWER')+'</button></section><aside><div class="panel"><div class="eyebrow">SYSTEM EVIDENCE</div><h2 style="font-size:23px;margin-top:8px">Diagnostic readout</h2><div class="terminal"><span class="dim">NOVA-LAB / CAPTURE</span><br>'+escape(q.log).replace(/\\n/g,'<br>')+'</div><p class="tiny">All addresses and diagnostics are fictional, for learning only.</p></div><div class="panel"><div class="eyebrow">FIELD NOTE</div><p class="tiny">Do not change everything at once. Verify one assumption, observe the result, then decide the next test.</p></div></aside></div>'}
function missionDone(){const m=missions[missionIndex];return '<section class="panel" style="text-align:center;padding:52px 20px"><div style="font-size:60px;color:var(--green)">✦</div><div class="eyebrow">MISSION COMPLETE</div><h1 style="font:800 55px Barlow Condensed;margin:5px">SYSTEM RECOVERED</h1><p>You completed '+m.name+'.'+(store.completed.includes(m.id)?' Replays build skill, even without extra XP.':'')+'</p><div class="statnum" style="color:var(--cyan)">+'+m.xp+' XP</div><div style="margin-top:20px"><button class="btn" data-action="leave">RETURN TO HQ</button></div></section>'}
function field(){return '<section class="panel"><div class="eyebrow">REFERENCE MANUAL / INTERACTIVE</div><h1 class="section-title" style="font-size:43px">THE OSI FIELD GUIDE</h1><p>Seven layers, one mental model: follow the packet from the application to the wire. Tap any layer for the practical troubleshooting angle.</p><div class="layers">'+layerData.map((l,i)=>'<button class="layer '+(expandedLayer===i?'expanded':'')+'" data-action="layer" data-value="'+i+'"><span class="layer-num">'+(7-i)+'</span><span><strong>'+l[0]+'</strong><small>'+l[1]+'</small></span>'+(expandedLayer===i?'<span class="layer-detail">'+l[2]+'</span>':'')+'</button>').join('')+'</div></section><section class="panel"><div class="eyebrow">QUICK REFERENCE</div><h2>NETWORKING MEMORY HOOKS</h2><p><strong>DNS:</strong> name → IP address.<br><strong>ARP:</strong> local IPv4 address → MAC address.<br><strong>/24:</strong> 255.255.255.0; 256 total addresses, usually 254 usable hosts.<br><strong>Switch / VLAN:</strong> Layer 2 forwarding and broadcast-domain separation.<br><strong>Router:</strong> forwards packets between IP networks.</p></section>'}
function profile(){let needed=(level()+1)*180-store.xp;return '<section class="panel"><div class="eyebrow">OPERATOR FILE</div><h1 class="section-title" style="font-size:44px">YOUR SERVICE RECORD</h1><p>Ranks come from actually clearing training missions, not clicking through slides.</p><h2>'+levelTag()+'</h2><div class="progress"><div style="width:'+(level()===5?100:(store.xp%180)/180*100)+'%"></div></div><p class="tiny">'+(level()===5?'Maximum rank achieved':needed+' XP to next rank')+'</p></section><div class="statstrip"><div class="stat"><div class="statnum">'+store.xp+'</div><div class="stat-label">XP</div></div><div class="stat"><div class="statnum">'+store.completed.length+'</div><div class="stat-label">Cleared</div></div><div class="stat"><div class="statnum">'+store.attempts+'</div><div class="stat-label">Attempts</div></div></div><section class="panel" style="margin-top:18px"><div class="eyebrow">ACHIEVEMENTS</div><h2>DECORATIONS</h2><p>'+(store.completed.length?'✦ FIRST CONTACT — Completed a network troubleshooting mission':'□ FIRST CONTACT — Clear your first mission')+'</p><p>'+(store.completed.length===missions.length?'✦ FULL SPECTRUM — Cleared every available mission':'□ FULL SPECTRUM — Clear all available missions')+'</p><p>'+(store.completed.length===missions.length?'✦ T.I.T.S. — Tactical Interface Troubleshooting Specialist':'□ T.I.T.S. — Tactical Interface Troubleshooting Specialist')+'</p><button class="reset" data-action="reset">Reset all local training progress</button></section>'}
function render(){el('levelBadge').textContent=levelTag();el('crumb').textContent='TRAINING COMMAND / '+(page==='home'?'HOME':page==='missions'?'MISSIONS':page==='field'?'FIELD GUIDE':page==='profile'?'OPERATOR FILE':'ACTIVE MISSION');el('view').innerHTML=page==='home'?home():page==='missions'?missionCards('Mission select'):page==='field'?field():page==='profile'?profile():page==='done'?missionDone():mission()}
document.addEventListener('click',function(e){let b=e.target.closest('[data-page], [data-action]');if(!b)return;if(b.dataset.page){nav(b.dataset.page);return}const a=b.dataset.action;if(a==='start'){missionIndex=Number(b.dataset.idx);questionIndex=0;selection=null;checked=false;page='mission';render();window.scrollTo(0,0)}else if(a==='leave'){nav('home')}else if(a==='choose'&&!checked){selection=Number(b.dataset.value);render()}else if(a==='check'&&selection!==null){checked=true;store.attempts++;persist();render()}else if(a==='next'){const m=missions[missionIndex];if(questionIndex<m.questions.length-1){questionIndex++;selection=null;checked=false;render();window.scrollTo(0,0)}else{if(!store.completed.includes(m.id)){store.completed.push(m.id);store.xp+=m.xp;persist();toast('+'+m.xp+' XP — mission cleared!')}page='done';render();window.scrollTo(0,0)}}else if(a==='layer'){expandedLayer=expandedLayer===Number(b.dataset.value)?-1:Number(b.dataset.value);render()}else if(a==='reset'){if(confirm('Erase all local XP and mission progress?')){store={...defaults,completed:[],award:[]};persist();render();toast('Training record reset')}}});
render();
})();
</script></body></html>
