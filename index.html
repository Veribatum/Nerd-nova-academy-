 JetBrains Mono}.wrap{padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:15px}.main{min-width:0}.rail{display:grid;gap:13px;align-content:start}.panel{background:linear-gradient(150deg,#0d263c,#0b1b2e);border:1px solid var(--border);border-radius:12px;padding:18px;min-width:0}.panel h2,.panel h3{margin:10px 0}.hero{position:relative;overflow:hidden;min-height:215px;padding:26px 32px;border:1px solid #28788d;border-radius:14px;background:linear-gradient(110deg,#123c4d,#10283c 60%,#141f35);display:flex;align-items:center}.hero:before{content:'◈';position:absolute;right:38px;top:-50px;font-size:300px;color:#3be2eb14}.hero .copy{position:relative;max-width:650px}.hero p{max-width:560px;color:#b8d1e2}.button{display:inline-flex;justify-content:center;align-items:center;gap:8px;background:var(--cyan);color:#05222d;border:1px solid #49f5f4;border-radius:7px;padding:11px 15px;font-weight:700;font-size:11px;letter-spacing:.4px;text-transform:uppercase}.button.alt{color:var(--white);background:#153248;border-color:#357089}.button.warn{background:#4a2530;color:#ffdfe4;border-color:#ad4e5d}.button:hover:not(:disabled){filter:brightness(1.12)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{display:flex;flex-direction:column}.card p{color:var(--muted);font-size:12px;flex:1}.card .art{font-size:31px;color:var(--cyan)}.card footer{display:flex;justify-content:space-between;align-items:center;gap:8px}.chip{border:1px solid #35637b;color:#b9d4e2;border-radius:4px;padding:4px 7px;font-size:10px;display:inline-block}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}.head h2{margin:0}.sub{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.progress{height:8px;background:#244056;border-radius:30px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#178da9,var(--cyan));transition:width .2s}.stat{font:700 28px JetBrains Mono}.objectives{display:grid;gap:10px}.objective{color:#b5ccdd;font-size:12px;display:flex;gap:10px;align-items:center}.objective b{display:grid;place-items:center;flex:none;border:1px solid #427086;border-radius:50%;width:20px;height:20px;color:var(--cyan)}.objective.done b{border-color:var(--green);color:var(--green)}.missionlayout{display:grid;grid-template-columns:1fr 1fr;gap:12px}.missionbanner{grid-column:1/-1}.wide{grid-column:1/-1}.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tab{background:#092038;border:1px solid #2a546e;border-radius:6px;padding:10px 12px;color:#aed0e0;font-size:11px}.tab.active{background:var(--cyan);color:#061c25;border-color:var(--cyan)}.evidence{min-height:310px}.network{position:relative;min-height:280px;background:radial-gradient(#28617a60 1px,transparent 1px) 0 0/19px 19px,#071727;border:1px solid #244b65;border-radius:9px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-content:center;gap:26px 10px;padding:25px 15px}.device{position:relative;z-index:2;border:1px solid #32748b;background:#103147;color:#edfaff;border-radius:9px;padding:12px 7px;min-height:82px;text-align:center;font-size:11px}.device b{font-size:20px;display:block;color:var(--cyan)}.device small{display:block;color:#9ebcce}.device.problem{border-color:#dd6975}.device.problem b{color:var(--red)}.device:hover{border-color:var(--cyan);transform:translateY(-2px)}.device.picked{box-shadow:0 0 0 2px var(--gold)}.deviceinfo{border:1px solid #346b83;border-radius:9px;padding:14px;margin-top:12px;background:#102c40;font-size:12px}.terminal{background:#030c14;color:#a6f5d9;font:12px/1.85 JetBrains Mono;padding:14px;border:1px solid #285571;border-radius:9px;min-height:225px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}.terminal form{display:flex;align-items:center;margin-top:8px;gap:8px}.terminal input{min-width:0;flex:1;background:transparent;border:0;color:#d3fff0;outline:none;font:12px JetBrains Mono}.packets{overflow:auto}.packets table{border-collapse:collapse;font:11px JetBrains Mono;min-width:550px;width:100%}.packets th,.packets td{padding:9px;text-align:left;border-bottom:1px solid #29475c}.packets th{color:var(--cyan)}.packets tr{cursor:pointer}.packets tbody tr:hover,.packets tbody tr.selected{background:#15445a}.packets .alert{color:#ff9fa8}.hint{border-left:3px solid var(--gold);padding:12px;background:#3b311e;color:#f6deb6;border-radius:5px;margin:10px 0;font-size:12px}.configrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.configrow label{font-size:11px;color:var(--muted)}.configrow input,.configrow select{display:block;width:100%;background:#071c2c;color:white;border:1px solid #35617b;border-radius:5px;padding:9px;margin-top:5px}.feedback{margin-top:12px;border:1px solid #376f6f;background:#0b393c;padding:12px;border-radius:8px;font-size:12px}.reward{overflow:hidden;position:relative;background:linear-gradient(125deg,#3f2437,#19253f);border:1px solid #88604a;min-height:170px}.reward:before{content:'✦';position:absolute;right:9px;top:-34px;font-size:190px;color:#f4ad8020}.reward .inner{position:relative}.reward strong{color:#ffd59e}.avatar{width:39px;height:39px;border-radius:50%;background:linear-gradient(145deg,#a4442f,#291626);display:grid;place-items:center;color:#ffdfcd;border:1px solid #d88262;font:700 22px Barlow Condensed}.novabox{position:relative;overflow:hidden;background:linear-gradient(125deg,#30263a,#132d3c);min-height:185px;border-color:#885855}.novabox:after{content:'NOVA';position:absolute;right:14px;bottom:-20px;font:800 112px Barlow Condensed;color:#ed77461c;pointer-events:none}.novabox{min-height:150px}.novabox p{max-width:none;padding-right:0}.novabox p{position:relative;z-index:1;max-width:155px;color:#ffdec7}.novabox h2{color:#f8b38d;position:relative;z-index:1}.small{font-size:11px;color:var(--muted)}.log{display:grid;gap:8px}.log div{padding:10px;border:1px solid #25516b;border-radius:7px;background:#0b1e30;font:11px JetBrains Mono}.answer{width:100%;text-align:left;background:#102d42;color:white;border:1px solid #34607a;border-radius:7px;padding:12px;margin:6px 0}.answer:hover{border-color:var(--cyan)}.answer.chosen{border-color:var(--cyan);background:#154d59}.answer.correct{border-color:var(--green)}.answer.wrong{border-color:var(--red)}.footer{text-align:center;color:#658397;font:10px JetBrains Mono;padding:20px}.notice{border:1px solid #866338;background:#382a1c;padding:13px;border-radius:9px;color:#f4ce9e;font-size:12px}.modalbg{position:fixed;inset:0;background:#000b;z-index:99;display:grid;place-items:center;padding:16px}.modal{width:min(550px,100%);background:#0e263b;border:1px solid #3c8296;padding:25px;border-radius:12px}.codearea{display:block;width:100%;height:95px;background:#051521;border:1px solid #386981;border-radius:7px;color:#d6f8ff;padding:10px;font:11px JetBrains Mono;overflow-wrap:anywhere}.empty{text-align:center;padding:50px 15px;color:var(--muted)}.hidden{display:none!important}

</style></head><body><div class="shell"><header class="header"><div class="logo"><div class="hex">N</div><div class="brand">NERD NOVA<small>ACADEMY</small></div></div><nav class="nav" aria-label="Navigation"><button data-page="hq" class="active"><span>⌂</span>HQ</button><button data-page="missions"><span>◎</span>Missions</button><button data-page="field"><span>▤</span>Training</button><button data-page="profile"><span>◈</span>Progress</button></nav><button class="sync-pill" data-action="sync">⇄ SAVE / TRANSFER</button></header><div class="wrap"><main id="main" class="main"></main><aside id="rail" class="rail"></aside></div><div class="footer">NERD NOVA ACADEMY // TRAIN SMART. BREAK LABS. FIX SYSTEMS.<br>FICTIONAL TRAINING NETWORKS ONLY — NEVER IMPORT CONTROLLED WORK DATA.</div></div><div id="modal" class="modalbg hidden"></div>
<script>
(()=>{'use strict';
const KEY='nerdnova_v2';const previous='nerdnova_v1_progress';
let saved={xp:0,completed:[],medals:[],history:[]};try{saved={...saved,...JSON.parse(localStorage.getItem(KEY)||'{}')};if(!saved.completed.length){let old=JSON.parse(localStorage.getItem(previous)||'{}');saved.xp=Math.max(saved.xp,old.xp||0);saved.completed=[...new Set([...(old.completed||[]),...saved.completed])];}}catch(e){}
const briefs=[["Camera Control Station","CAM-01 answers ping, but the operator has no video.","Ethernet link UP; ICMP replies received; UDP stream not confirmed.","Inspect the topology, capture, and endpoint settings; restore video without changing unrelated VLANs.","Network map · packet capture · terminal · camera configuration","Restore the stream while preserving VLAN 10.","Morning, Marine. Ping is one clue, not a clean bill of health. Follow the traffic.","CAM-01 sent video to UDP 5600; the viewer listened on 5700. Matching the ports restored the synthetic feed."],["Communications Workshop","A watchstander misreads a capture while checking a local camera network.","ARP request/reply, ICMP, and UDP packets are available.","Identify what the evidence demonstrates, and what still needs checking.","Packet capture · topology · terminal","Interpret the network behavior accurately.","Those packets are telling a story. Read it before you make the network a bigger problem.","ARP identifies a local IPv4 address to MAC mapping. ICMP success does not prove the intended UDP service works."],["Network Operations Center","A device responds to ping, but the video application still times out.","ICMP path works; application ports and traffic delivery are unverified.","Choose the next test that narrows the failure while minimizing changes.","Network map · terminal · packet capture","Select a sound investigative step.","Do not rebuild the whole ship because one console is complaining. Find what works and what does not.","Validate destination IP, transport port, and packet arrival before changing routes or VLANs."]];
const levels=['ROOKIE','TECHNICIAN','SPECIALIST','ENGINEER','ARCHITECT','NOVA ELITE'];
const cases=[
{id:'cam',number:'01',title:'The Silent Camera',type:'INVESTIGATION',xp:250,detail:'The camera responds to ping. Its video stream does not. Inspect evidence and correct the network issue.',diff:'ROOKIE',kind:'lab'},
{id:'arp',number:'02',title:'Ghost in the Wire',type:'PACKET HUNT',xp:160,detail:'Analyze an Ethernet packet sample and identify the protocol behavior before recommending the next diagnostic.',diff:'TECHNICIAN',kind:'packets'},
{id:'route',number:'03',title:'Route to Nowhere',type:'DECISION TREE',xp:160,detail:'Compare two plausible troubleshooting paths. Make an evidence-based diagnosis.',diff:'SPECIALIST',kind:'decision'}];
const packets=[['01','0.000','10.0.0.20','10.0.0.42','ARP','Who has 10.0.0.42?'],['02','0.003','10.0.0.42','10.0.0.20','ARP','10.0.0.42 is at 02:aa:10:42:00:01'],['03','0.028','10.0.0.20','10.0.0.42','ICMP','Echo request'],['04','0.032','10.0.0.42','10.0.0.20','ICMP','Echo reply'],['05','0.140','10.0.0.42','10.0.0.20','UDP','Video datagram to 5600'],['06','0.170','10.0.0.42','10.0.0.20','UDP','Video datagram to 5600']];
let bridgeState='not checked',bridgeMessage='Start Windows companion to enable local VM status',page='hq',active=0,tool='map',node='CAM-01',seen=new Set(),packet=-1,term=['NOVA-LAB ONLINE. Type help for available simulated commands.'],terminalText='',phase=0,answer=null,checked=false,completedThisSession=false,config={port:'5700',vlan:'10'};
const $=id=>document.getElementById(id),h=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem(KEY,JSON.stringify(saved))}
function rank(){return Math.min(5,Math.floor(saved.xp/500))}
function medal(id){if(!saved.medals.includes(id))saved.medals.push(id)}
function nav(p){page=p;render();window.scrollTo(0,0)}
function begin(i){active=i;page='briefing';tool=cases[i].kind==='packets'?'packets':'map';node='CAM-01';seen=new Set();packet=-1;phase=0;answer=null;checked=false;completedThisSession=false;config={port:'5700',vlan:'10'};render();window.scrollTo(0,0)}
function complete(){const c=cases[active];if(!saved.completed.includes(c.id)){saved.completed.push(c.id);saved.xp+=c.xp;medal('FIRST CONTACT');if(saved.completed.length===3)medal('T.I.T.S.');saved.history.unshift({id:c.id,at:new Date().toISOString()});persist()}completedThisSession=true;page='complete';render();window.scrollTo(0,0)}
function cards(){return '<div class="head"><div><h2>ACTIVE OPERATIONS</h2><div class="sub">Select a mission. Learn by investigating, not guessing.</div></div></div><div class="cards">'+cases.map((c,i)=>'<article class="panel card"><div class="eyebrow">MISSION // '+c.number+'</div><div class="art">'+(i===0?'◉':i===1?'⌁':'◇')+'</div><h3>'+c.title+'</h3><p>'+c.detail+'</p><div><span class="chip">'+c.type+'</span> <span class="chip">'+c.diff+'</span></div><footer style="margin-top:15px"><span class="small">+'+c.xp+' XP</span><button class="button alt" data-start="'+i+'">'+(saved.completed.includes(c.id)?'REPLAY':'DEPLOY')+' →</button></footer></article>').join('')+'</div>'}
function home(){return '<section class="panel" style="border-color:#28788d"><div class="row"><div><div class="eyebrow">REAL LAB LINK / WINDOWS</div><h3 style="margin:7px 0">Vehicle Node Connection</h3><div class="small" id="labstatus">'+bridgeState+' — '+bridgeMessage+'</div></div><button class="button alt" data-action="probe">CHECK VM</button></div></section>'+'<section class="hero"><div class="copy"><div class="eyebrow">NOVA // MISSION CONTROL</div><h1>WELCOME BACK,<br><span style="color:var(--cyan)">OPERATOR.</span></h1><p>Technical operations: network faults, RHEL, virtual switches, packet analysis and field diagnostics. Investigate the evidence and earn your stripes.</p><button class="button" data-start="0">▶ BEGIN INVESTIGATION</button></div></section>'+cards()+'<div class="head"><h2>TRAINING PROTOCOL</h2></div><div class="panel"><div class="row"><div><strong>Investigation first</strong><div class="sub">Inspect the network, review packets, interrogate the lab and apply a fix.</div></div><span class="chip">LEARN → TEST → FIX</span></div></div>'}
function rail(){return '<section class="panel novabox"><div class="eyebrow">NOVA // MISSION CONTROL</div><h2>Your wingwoman</h2><p>“Use your head, Marine. I only hand out medals when you earn them.”</p><div class="small">Nova reporting for duty. Earn the morale gallery by completing missions.</div></section><section class="panel"><div class="eyebrow">OPERATOR STATUS</div><h2>LVL '+String(rank()+1).padStart(2,'0')+' · '+levels[rank()]+'</h2><div class="progress"><div style="width:'+(saved.xp%500/500*100)+'%"></div></div><p class="small">'+saved.xp+' XP TOTAL · '+saved.completed.length+'/'+cases.length+' CLEARED</p></section><section class="panel"><div class="eyebrow">DECORATIONS</div><h3>'+(saved.medals.includes('FIRST CONTACT')?'✦':'◇')+' First Contact</h3><p class="small">Clear your first mission.</p><h3>'+(saved.medals.includes('T.I.T.S.')?'✦':'◇')+' T.I.T.S.</h3><p class="small">Tactical Interface Troubleshooting Specialist. Clear all three missions.</p></section><section class="panel reward"><div class="inner"><div class="eyebrow" style="color:var(--gold)">MORALE REWARD</div><h3>'+(saved.completed.length?'Morale unlocked':'Classified until cleared')+'</h3><p class="small">Clear missions to unlock Nova’s morale gallery. Artwork will be added when deployable assets are ready.</p></div></section><button class="button alt" data-action="sync">⇄ TRANSFER SAVE BETWEEN DEVICES</button>'}
function missionHeading(c){return '<section class="panel missionbanner"><div class="row"><div><div class="eyebrow">MISSION // '+c.number+' / '+c.type+'</div><h1 style="margin:8px 0 11px">'+c.title+'</h1><div class="muted">'+c.detail+'</div></div><button class="button alt" data-page="missions">EXIT</button></div></section>'}
function briefing(){const c=cases[active],b=briefs[active];return '<section class="panel"><div class="eyebrow">INCOMING TASKING // WATCHSTATION ORDERS</div><h1>'+c.title+'</h1><span class="chip">PRIORITY: TRAINING</span> <span class="chip">'+c.diff+'</span><p class="small" style="margin-top:12px">LOCATION: '+b[0]+' · REWARD: '+c.xp+' XP</p>'+[['SITUATION',b[1]],['KNOWN INTEL',b[2]],['ORDERS',b[3]],['AUTHORIZED TOOLS',b[4]],['SUCCESS CRITERIA',b[5]]].map(x=>'<div class="deviceinfo"><div class="eyebrow">'+x[0]+'</div><p>'+x[1]+'</p></div>').join('')+'<div class="panel novabox" style="margin-top:14px"><div class="eyebrow">NOVA // MISSION BRIEFING</div><h2>Listen up, Marine.</h2><p style="max-width:490px">'+b[6]+'</p></div><button class="button" data-action="enter-mission">ACKNOWLEDGE ORDERS →</button> <button class="button alt" data-page="missions">BACK</button></section>'}
function objectPanel(c){let labs=active===0;let objectives=labs?['Inspect the network map','Inspect network traffic','Review camera configuration','Correct stream destination port']:active===1?['Examine the packet list','Choose the correct interpretation']:['Review the symptoms','Select the best investigative path'];return '<section class="panel"><div class="eyebrow">MISSION PARAMETERS</div><p class="small">ENVIRONMENT: SYNTHETIC LAB<br>DIFFICULTY: '+c.diff+'<br>ACCESS: SIMULATED DEVICES ONLY<br>REWARD: '+c.xp+' XP<br>TIME LIMIT: NONE</p><div class="eyebrow" style="margin:18px 0 12px">OBJECTIVES</div><div class="objectives">'+objectives.map((o,i)=>'<div class="objective '+((labs?(i===0&&seen.has('map')||i===1&&seen.has('packets')||i===2&&seen.has('config')||i===3&&completedThisSession):(i===0&&seen.size>0||i===1&&completedThisSession))?'done':'')+'"><b>'+((labs?(i===0&&seen.has('map')||i===1&&seen.has('packets')||i===2&&seen.has('config')||i===3&&completedThisSession):(i===0&&seen.size>0||i===1&&completedThisSession))?'✓':'○')+'</b>'+o+'</div>').join('')+'</div></section>'}
function network(){return '<div class="network">'+[['VIEWER','▣','10.0.0.20'],['SW-1','⌘','VLAN 10'],['CAM-01','◉','10.0.0.42'],['ROUTER','◇','10.0.0.1'],['SERVER','▥','10.0.0.80'],['MONITOR','▧','NO VIDEO']].map(a=>'<button class="device '+(a[0]==='CAM-01'?'problem ':'')+(node===a[0]?'picked':'')+'" data-node="'+a[0]+'"><b>'+a[1]+'</b>'+a[0]+'<small>'+a[2]+'</small></button>').join('')+'</div><div class="deviceinfo"><div class="eyebrow">SELECTED NODE / '+h(node)+'</div><p style="margin:7px 0 0">'+({'CAM-01':'Camera powered. Link UP. IP 10.0.0.42/24. UDP video sent to 10.0.0.20:5600.','VIEWER':'Viewing workstation: 10.0.0.20/24. Expects UDP video on port 5700.','SW-1':'Ports 2 and 5: access VLAN 10. Both links operational.','ROUTER':'No routing is needed for traffic between 10.0.0.20/24 and 10.0.0.42/24.','SERVER':'Lab server healthy; not in the video path.','MONITOR':'Viewing application reports VIDEO TIMEOUT.'})[node]+'</p></div>'}
function packetView(){return '<div class="packets"><table><thead><tr><th>No</th><th>Time</th><th>Source</th><th>Destination</th><th>Protocol</th><th>Info</th></tr></thead><tbody>'+packets.map((p,i)=>'<tr data-packet="'+i+'" class="'+(packet===i?'selected':'')+'"><td>'+p.join('</td><td>')+'</td></tr>').join('')+'</tbody></table></div><p class="small">Click a row to inspect. This is a synthetic packet sample, not a live capture.</p>'+(packet>=0?'<div class="deviceinfo"><strong>FRAME '+h(packets[packet][0])+' — '+h(packets[packet][4])+'</strong><p>'+h(packets[packet][5])+'</p></div>':'')+'<div class="hint">Notice: successful ICMP replies prove IP reachability, not that the viewing application receives UDP on the expected port.</div>'}
function terminal(){return '<div class="terminal">'+term.map(t=>h(t)).join('\n')+'<form id="termform"><span>nova@lab:~$</span><input id="cmd" aria-label="Simulated terminal command" autocomplete="off" placeholder="type help"></form></div><p class="small">Sandbox commands: help, ping 10.0.0.42, ip addr, ip route, ss -uln, show camera, clear. No real commands run.</p>'}
function configView(){return '<p class="muted">The camera is sending video, but the viewer expects a different UDP port. Inspect the endpoint details and make one controlled change.</p><div class="terminal">CAM-01 / STATUS\nIP: 10.0.0.42/24\nLINK: UP\nVIDEO MODE: UDP\nSTREAM DESTINATION: 10.0.0.20\nVIEWER LISTENER: 10.0.0.20:5700</div><div class="configrow"><label>Camera destination UDP port<input id="port" type="number" min="1" max="65535" value="'+h(config.port)+'"></label><label>Switch access VLAN<select id="vlan"><option value="10" '+(config.vlan==='10'?'selected':'')+'>10 (current)</option><option value="20" '+(config.vlan==='20'?'selected':'')+'>20</option></select></label></div><button class="button" data-action="apply">APPLY LAB CONFIGURATION</button><div id="applyfeedback"></div>'}
function caseView(){const c=cases[active];let tabs=[['map','NETWORK MAP'],['packets','PACKET CAPTURE'],['terminal','TERMINAL'],['config','CONFIGURATION']];return '<div class="missionlayout">'+missionHeading(c)+objectPanel(c)+'<section class="panel"><div class="eyebrow">NOVA / FIELD BRIEF</div><h2>Find the actual fault.</h2><p>'+(active===0?'The camera answers ping. You suspect the route, VLAN, or stream settings. Those are all plausible starting points; gather evidence before making changes.':active===1?'Packets tell a story. Which protocol actually establishes the local MAC relationship?': 'The remote node responds to ping, but an application connection times out. Several hypotheses remain. Pick the next test that separates them.')+'</p><div class="hint">Every lab here is synthetic. Do not use production IP maps, configuration dumps, or classified captures.</div></section><section class="panel wide"><div class="eyebrow">SYSTEM EVIDENCE / INVESTIGATION CONSOLE</div><div class="tools" style="margin-top:12px">'+tabs.map(([id,t])=>'<button class="tab '+(tool===id?'active':'')+'" data-tool="'+id+'">'+t+'</button>').join('')+'</div><div class="evidence">'+(tool==='map'?network():tool==='packets'?packetView():tool==='terminal'?terminal():configView())+'</div></section><section class="panel wide"><div class="eyebrow">MISSION DECISION</div>'+decision()+'</section></div>'}
function decision(){if(active===0)return '<h2>Restore the camera feed</h2><p class="muted">Investigate the map, packet sample, and configuration tab. When ready, change the destination UDP port and apply the correction. The switch VLAN is a decoy setting; leave it alone.</p><button class="button alt" data-tool="config">OPEN CONFIGURATION →</button>';
const qs=active===1?{q:'The packet sample shows ARP, ICMP, then UDP. Which conclusion is best supported?',o:['The physical cable must be broken','ARP resolved the camera MAC and ICMP worked; inspect UDP endpoints next','DNS is blocking all Layer 2 communications','UDP always guarantees delivery'],a:1,why:'ARP resolved the local MAC and ICMP showed IP reachability. The stream still needs correct UDP destination/port and a listening application.'}:{q:'A device answers ICMP but a video client times out. Which first test most efficiently separates possible causes?',o:['Change every switch VLAN until video appears','Verify the video destination IP/port and whether packets arrive at the viewer','Replace the camera immediately','Assume ICMP confirms UDP is working'],a:1,why:'Confirming the flow endpoints and packet arrival helps distinguish configuration errors, network filtering, and application issues. Ping alone does not prove application traffic works.'};
return '<h2>'+qs.q+'</h2>'+qs.o.map((o,i)=>'<button class="answer '+(answer===i?'chosen':'')+(checked?(i===qs.a?' correct':answer===i?' wrong':''):'')+'" data-answer="'+i+'" '+(checked?'disabled':'')+'>'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+(checked?'<div class="feedback">'+(answer===qs.a?'✓ Good diagnosis. ':'Review: ')+qs.why+'</div>':'')+'<button class="button" data-action="'+(checked?'complete':'check')+'" '+(!checked&&answer===null?'disabled':'')+'>'+(checked?'FINISH MISSION →':'LOCK IN DIAGNOSIS')+'</button>'}
function field(){const manuals=[["SWITCH / ROUTER CLI","show interfaces gigabitEthernet 0/1 — inspect status, counters and errors","show ip interface brief — quick interface summary","show vlan brief — inspect VLANs on supported switches","show ip route — inspect routing decisions"],["RHEL / NETWORKMANAGER","nmcli device status — device and connection states","nmcli connection show — saved and active profiles","nmcli device show — detailed device settings","ip -br address — concise interface addresses","ip route — Linux routes","ss -tuln — local sockets"],["OPEN vSWITCH","ovs-vsctl show — inspect OVS topology","ovs-vsctl list-br — list bridges","ovs-vsctl list-ports br0 — inspect example bridge ports","ovs-ofctl show br0 — inspect OpenFlow ports when supported"],["FAULT ISOLATION","Link UP is not proof of IP communication","Ping success is not proof of video delivery","Increasing errors suggest a possible link issue","Inspect the approved baseline before changing routes or VLANs"]];return '<section class="panel"><div class="eyebrow">TECHNICAL OPERATIONS // FIELD MANUAL</div><h1>THE TOOLKIT</h1><p class="muted">Broader than networking: switches, RHEL, virtual networks, packet analysis and diagnostics. Generic, fictional training only.</p></section>'+manuals.map(group=>'<section class="panel"><div class="eyebrow">'+group[0]+'</div>'+group.slice(1).map(line=>'<div class="deviceinfo"><span class="mono">'+line+'</span></div>').join('')+'</section>').join('')}
function profile(){return '<section class="panel"><div class="eyebrow">OPERATOR PROFILE</div><h1>YOUR SERVICE RECORD</h1><h2>LVL '+(rank()+1)+' · '+levels[rank()]+'</h2><div class="progress"><div style="width:'+(saved.xp%500/500*100)+'%"></div></div><p class="muted">'+saved.xp+' XP / '+saved.completed.length+' missions cleared</p><div class="eyebrow">COMPLETED OPERATIONS</div>'+ (saved.completed.length?saved.completed.map(id=>'<div class="deviceinfo">✓ '+(cases.find(c=>c.id===id)||{title:id}).title+'</div>').join(''):'<p class="small">No missions cleared yet.</p>')+'<br><button class="button" data-action="sync">TRANSFER SAVE →</button></section>'}
function finish(){const c=cases[active],b=briefs[active];return '<div class="panel" style="text-align:center;padding:35px 25px;border-color:#489488"><div style="font-size:46px;color:var(--gold)">✦</div><div class="eyebrow">MISSION COMPLETE / NOVA APPROVES</div><h1>SYSTEM RESTORED.</h1><p>'+b[7]+'</p><h2 style="color:var(--cyan)">+'+c.xp+' XP</h2><p class="small">Nova says: Another one down, Marine. The gallery expands as you clear new challenges.</p><button class="button" data-page="missions">NEXT MISSION →</button></div>'}
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('main').innerHTML=page==='hq'?home():page==='missions'?cards():page==='field'?field():page==='profile'?profile():page==='complete'?finish():page==='briefing'?briefing():caseView();$('rail').innerHTML=rail()}
function showSync(){const data=btoa(unescape(encodeURIComponent(JSON.stringify(saved))));$('modal').classList.remove('hidden');$('modal').innerHTML='<div class="modal"><div class="row"><h2>SAVE TRANSFER</h2><button class="button alt" data-action="close">×</button></div><p>Cross-device cloud sync is not linked yet. For now, copy your save code from one device and import it on the other. This is a manual transfer, not automatic syncing.</p><div class="eyebrow">EXPORT SAVE CODE</div><textarea class="codearea" readonly id="export">'+h(data)+'</textarea><p><button class="button" data-action="copy">COPY SAVE CODE</button></p><div class="eyebrow">IMPORT SAVE CODE</div><textarea class="codearea" id="import" placeholder="Paste code from your other device"></textarea><p><button class="button alt" data-action="import">IMPORT PROGRESS</button></p><div class="notice">Automatic syncing needs a connected account or backend. Never paste passwords or sensitive work data here.</div></div>'}
function handleCmd(raw){const c=raw.trim().toLowerCase();if(c==='clear'){term=[];return}const outputs={'help':'Available: help, ping 10.0.0.42, ip addr, ip route, ss -uln, show camera, clear','ping 10.0.0.42':'PING 10.0.0.42: 3 sent, 3 received, 0% loss','ip addr':'eth0: 10.0.0.20/24  state UP','ip route':'10.0.0.0/24 dev eth0 scope link\\ndefault via 10.0.0.1','ss -uln':'UNCONN UDP 10.0.0.20:5700','show camera':'CAM-01: UP\\nUDP destination 10.0.0.20:5600\\nViewer expects 5700'};term.push('nova@lab:~$ '+raw);term.push(outputs[c]||'Command not recognized. This terminal is a limited offline simulation; type help.');if(term.length>24)term=term.slice(-24)}
document.addEventListener('submit',e=>{if(e.target.id==='termform'){e.preventDefault();let v=$('cmd').value;handleCmd(v);seen.add('terminal');render();let cmd=$('cmd');if(cmd)cmd.focus()}});
document.addEventListener('click',e=>{let b=e.target.closest('button[data-page],button[data-start],button[data-action],button[data-tool],button[data-node],tr[data-packet],button[data-answer]');if(!b)return;if(b.dataset.page){nav(b.dataset.page);return}if(b.dataset.start!==undefined){begin(Number(b.dataset.start));return}if(b.dataset.tool){tool=b.dataset.tool;seen.add(tool);render();return}if(b.dataset.node){node=b.dataset.node;seen.add('map');render();return}if(b.dataset.packet!==undefined){packet=Number(b.dataset.packet);seen.add('packets');render();return}if(b.dataset.answer!==undefined&&!checked){answer=Number(b.dataset.answer);render();return}switch(b.dataset.action){case 'probe':bridgeState='checking';bridgeMessage='Contacting local companion';render();fetch('http://127.0.0.1:8765/vm/status',{mode:'cors',cache:'no-store',signal:AbortSignal.timeout(5000)}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{bridgeState=d.connected?(d.running?'CONNECTED':'VM OFFLINE'):'NOT FOUND';bridgeMessage=d.connected?d.vm+' · '+d.state:(d.error||'Target VM unavailable');render()}).catch(err=>{bridgeState='COMPANION OFFLINE';bridgeMessage='Run companion/start-companion.bat on Windows, then retry';render()});break;case 'enter-mission':page='mission';render();window.scrollTo(0,0);break;case 'apply':config.port=$('port').value;config.vlan=$('vlan').value;seen.add('config');if(config.port==='5700'&&config.vlan==='10'){complete()}else{render();let msg=config.vlan!=='10'?'Wrong VLAN: you isolated the devices. Restore VLAN 10.':'The viewer is listening on UDP 5700. Inspect the capture and align the destination port.';$('applyfeedback').innerHTML='<div class="feedback">'+msg+'</div>'}break;case 'check':checked=true;seen.add('diagnosis');render();break;case 'complete':if(active===0||answer===(active===1?1:1)){complete()}else{checked=false;answer=null;render()}break;case 'sync':showSync();break;case 'close':$('modal').classList.add('hidden');break;case 'copy':$('export').select();navigator.clipboard?.writeText($('export').value).then(()=>{b.textContent='COPIED ✓'}).catch(()=>{document.execCommand('copy');b.textContent='SELECTED / COPY'});break;case 'import':try{let input=$('import').value.trim();let obj=JSON.parse(decodeURIComponent(escape(atob(input))));if(typeof obj.xp!=='number'||!Array.isArray(obj.completed))throw Error('Invalid');saved={xp:Math.max(0,Math.min(999999,Math.floor(obj.xp))),completed:obj.completed.filter(x=>cases.some(c=>c.id===x)),medals:Array.isArray(obj.medals)?obj.medals:[],history:Array.isArray(obj.history)?obj.history:[]};persist();$('modal').classList.add('hidden');nav('profile')}catch(err){alert('That save code is invalid. Copy the complete code from the other device.')}break;}});
render();
})();
</script></body></html>
